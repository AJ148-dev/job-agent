[project]
name = "jobagent"
version = "0.1.0"
description = "Personal job-finding agent: LinkedIn feed -> local LLM -> Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
]

[project.scripts]
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
