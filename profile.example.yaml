# Copy to profile.yaml and edit.
resume_path: resume.pdf          # .pdf, .txt or .md

target_roles:
  - Backend Engineer
  - AI Engineer

locations:                       # empty list = any location; list spelling variants
  - Bangalore
  - Bengaluru
  - Remote
remote_ok: true

min_years: 0                     # your experience
max_years: 4                     # jobs asking more than max_years + 1 are dropped; unstated is kept

must_have_skills:
  - Python
nice_to_have_skills:
  - LLM
  - FastAPI

exclude_keywords:                # posts containing these are dropped
  - unpaid
  - commission only

min_score: 0                     # optional: only send jobs with fit score >= this
